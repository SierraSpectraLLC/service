# Open, rebuild or remove the demo workspace - from a phone, with no terminal.
#
# Actions > Demo workspace > Run workflow. Start with "check", which writes
# nothing and reports exactly what a real run would change on THIS instance.
#
# Setup, once, all of it from the GitHub web UI:
#   Settings > Environments > New environment: demo
#   (any name works - if you call it something else, type that name into the
#    workflow's `environment` input when you run it. A name that does not match
#    is the one failure mode here that is silent: GitHub creates an empty
#    environment rather than complaining, and every secret reads as unset.)
#   Add these secrets:
#     DATABASE_URL          the pooled Neon string
#     DEMO_PASSWORD         the password you will hand over (10+ chars, and it
#                           may not contain the local part of the owner address)
#     BLOB_READ_WRITE_TOKEN optional; without it the demo's files do not open
#
#   ON THE ENVIRONMENT if you can - an environment secret is readable only by a
#   job that names the environment, so ordinary CI never sees your production
#   connection string. But environment SECRETS are not offered on every plan for
#   a private repository (variables sometimes are, on the same page, which is
#   its own trap), so this is a preference and not a requirement.
#
#   REPOSITORY SECRETS WORK TOO, unchanged: Settings > Secrets and variables >
#   Actions > Secrets tab > New repository secret. `secrets.X` reads those as
#   well; an environment secret of the same name simply wins. The cost is that
#   every workflow in the repo can then read them, ci.yml included.
#   Optionally add an approval rule to the environment so a run needs a second
#   pair of eyes.
#
# Nothing secret is ever printed. DEMO_PASSWORD is required for seed and reset
# precisely so the script never has to generate one and echo it into a log that
# everybody with read access can see.
name: Demo workspace

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: check
        options:
          - check          # dry run: writes nothing, reports the blast radius
          - seed           # open the demo workspace
          - reset          # remove it and rebuild it from scratch
          - wipe           # remove it and stop
      keep_instance_settings:
        description: "Leave app_settings completely alone (no module flags, no defaults)"
        type: boolean
        default: false
      stripe_account:
        description: "Stripe Connect account for the demo, test mode (optional)"
        type: string
        default: ""
      # Named rather than hardcoded because getting this wrong is silent:
      # `environment: demo` against an environment actually called something
      # else does not fail, it CREATES an empty one and the job runs on with no
      # secrets at all. If your secrets live somewhere else, type its name here.
      environment:
        description: "Environment holding the secrets (must match Settings > Environments exactly)"
        type: string
        default: demo

# One at a time: two runs against one database is a race nobody needs.
concurrency: demo-workspace

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the inputs before touching anything
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
          HAS_PW: ${{ secrets.DEMO_PASSWORD != '' }}
          HAS_BLOB: ${{ secrets.BLOB_READ_WRITE_TOKEN != '' }}
          # Same page, one panel higher. A connection string typed in there is
          # plainly visible to whoever typed it and completely invisible here.
          DB_AS_VAR: ${{ vars.DATABASE_URL != '' }}
        run: |
          echo "Environment requested: '$ENVIRONMENT'"
          echo "  DATABASE_URL as a secret:      $HAS_DB"
          echo "  DEMO_PASSWORD as a secret:     $HAS_PW"
          echo "  BLOB token as a secret:        $HAS_BLOB"
          echo "  DATABASE_URL as a VARIABLE:    $DB_AS_VAR"

          if [ "$HAS_DB" != "true" ]; then
            # "It is not set" is the one thing this is usually NOT, and saying
            # it sent somebody to stare at a secret that was plainly there. A
            # repository-level secret would have resolved here too, so an empty
            # one means the job is not looking where the value actually is.
            if [ "$DB_AS_VAR" = "true" ]; then
              echo "::error::DATABASE_URL is set as a VARIABLE on '$ENVIRONMENT', not as a secret. An environment page has both panels and they take the same names. Delete it from Variables and add it under Environment secrets - a connection string belongs there anyway, since variables are printed in logs."
            elif [ "$HAS_PW" != "true" ] && [ "$HAS_BLOB" != "true" ]; then
              echo "::error::This job could not see ANY secret, which usually means the environment name does not match. It asked for one called '$ENVIRONMENT'; GitHub does not fail on a name that does not exist - it creates an empty one and carries on. Open Settings > Environments and compare the name character for character; if yours is called something else, re-run and type that name into the 'environment' input. (Secrets set at repository level would have resolved here too, so that is not the cause.)"
            else
              echo "::error::DATABASE_URL is not set on the '$ENVIRONMENT' environment, though other secrets there are visible. Add it: the pooled Neon connection string."
            fi
            exit 1
          fi
          # A generated password would have to be printed to be useful, and a
          # printed password is a credential in a log. So: supply one.
          if { [ "$ACTION" = "seed" ] || [ "$ACTION" = "reset" ]; } && [ "$HAS_PW" != "true" ]; then
            echo "::error::Add a DEMO_PASSWORD secret to the '$ENVIRONMENT' environment first - at least 10 characters."
            exit 1
          fi

      - name: ${{ inputs.action }}
        id: run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DEMO_OWNER_EMAIL: ${{ vars.DEMO_OWNER_EMAIL }}
          DEMO_ORG_NAME: ${{ vars.DEMO_ORG_NAME }}
        run: |
          set -o pipefail
          FLAGS=""
          case "${{ inputs.action }}" in
            check) FLAGS="--dry-run" ;;
            seed)  FLAGS="" ;;
            reset) FLAGS="--reset" ;;
            wipe)  FLAGS="--wipe" ;;
          esac
          if [ "${{ inputs.keep_instance_settings }}" = "true" ]; then
            FLAGS="$FLAGS --no-modules"
          fi
          if [ -n "${{ inputs.stripe_account }}" ]; then
            FLAGS="$FLAGS --stripe-account=${{ inputs.stripe_account }}"
          fi
          echo "Running: npx tsx scripts/seed-demo.ts $FLAGS"
          npx tsx scripts/seed-demo.ts $FLAGS 2>&1 | tee /tmp/demo.log

      # The job summary is what GitHub's mobile app shows without making anybody
      # scroll a log, which is the whole point of running this from a phone.
      - name: Report
        if: always()
        run: |
          {
            echo "## Demo workspace - \`${{ inputs.action }}\`"
            echo
            echo '```'
            cat /tmp/demo.log 2>/dev/null || echo "(the run produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
