<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridgeline · Financial (redesign mockup)</title>
<style>
:root {
  --navy: #172A4A; --navy-2: #21395F; --coral: #E8613C; --coral-2: #D4532F;
  --coral-wash: #FDF2F1; --sky: #5BA8D9; --slate: #64748B;
  --bg: #F5F6F9; --card: #FFFFFF; --line: #E4E8EF; --ink: #1E293B; --mut: #64748B; --link: #1D6396;
  --hover: #EDF1F7; --current: #E9EEF6;
  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(23,42,74,.05); --shadow-md: 0 8px 24px rgba(23,42,74,.14);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-micro: 10px; --fs-meta: 11px; --fs-small: 12px; --fs-body: 13px; --fs-lead: 14px;
  --fs-title: 16px; --fs-hero: 19px; --fs-page: 22px; --fs-metric: 26px; --fs-figure: 48px;
  --t-neutral-bg:#EEF1F5; --t-neutral-fg:#475569; --t-faint-bg:#F4F6F9; --t-faint-fg:#94A3B8;
  --t-info-bg:#E7F2FA; --t-info-fg:#1D6396; --t-good-bg:#E5F3E5; --t-good-fg:#2E6B2E;
  --t-warn-bg:#FAF0DC; --t-warn-fg:#8A5410; --t-accent-bg:#EDEBFA; --t-accent-fg:#4F45A3;
  --t-bad-bg:#FBE9E9; --t-bad-fg:#A32D2D;
  --dur: 140ms; --ease: cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1726; --card:#172033; --line:#26324A; --ink:#E6EAF2; --mut:#93A0B8; --link:#7FB6E0;
  --hover:#1E2A40; --current:#22304A; --slate:#A3AFC4;
  --t-neutral-bg:#26324A; --t-neutral-fg:#C5CEDD; --t-faint-bg:#1B2436; --t-faint-fg:#7A879C;
  --t-info-bg:#183246; --t-info-fg:#8CC5EA; --t-good-bg:#173321; --t-good-fg:#8ED08E;
  --t-warn-bg:#3A2C10; --t-warn-fg:#F0C273; --t-accent-bg:#26224A; --t-accent-fg:#B9B0F2;
  --t-bad-bg:#40191B; --t-bad-fg:#F1A0A0;
}}
:root[data-theme="dark"] {
  --bg:#0F1726; --card:#172033; --line:#26324A; --ink:#E6EAF2; --mut:#93A0B8; --link:#7FB6E0;
  --hover:#1E2A40; --current:#22304A; --slate:#A3AFC4;
  --t-neutral-bg:#26324A; --t-neutral-fg:#C5CEDD; --t-faint-bg:#1B2436; --t-faint-fg:#7A879C;
  --t-info-bg:#183246; --t-info-fg:#8CC5EA; --t-good-bg:#173321; --t-good-fg:#8ED08E;
  --t-warn-bg:#3A2C10; --t-warn-fg:#F0C273; --t-accent-bg:#26224A; --t-accent-fg:#B9B0F2;
  --t-bad-bg:#40191B; --t-bad-fg:#F1A0A0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: var(--fs-body); line-height: 1.45;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--link); }
.money { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 700; }
h2 { font-size: var(--fs-title); }
h3 { font-size: var(--fs-lead); }
.mut { color: var(--mut); }
.sm { font-size: var(--fs-small); }
.meta { font-size: var(--fs-meta); color: var(--mut); }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

/* ── chrome ─────────────────────────────────────────────────────────── */
.topbar {
  background: var(--navy); color: #fff; height: 48px; display: flex; align-items: center;
  padding: 0 20px; gap: 18px; position: sticky; top: 0; z-index: 20;
}
.topbar .wordmark { font-weight: 800; letter-spacing: -.01em; font-size: var(--fs-lead); }
.topbar .op { opacity: .75; font-size: var(--fs-small); }
.topbar .sp { flex: 1; }
.topbar .mock { font-size: var(--fs-micro); opacity: .6; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.head h1 { font-size: var(--fs-page); }
.head .sub { color: var(--mut); margin-top: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; color: var(--slate); font-size: var(--fs-small); font-weight: 700; padding: 6px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }

.rail-body { display: grid; grid-template-columns: 196px minmax(0,1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: 68px; }
.railhead { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .9px; font-weight: 700; color: var(--slate); padding: 0 8px 8px; }
.rail ul + .railhead { padding-top: 14px; }
.rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail button {
  width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0;
  border-radius: var(--radius); padding: 7px 8px 7px 12px; text-align: left;
  border-left: 3px solid transparent;
}
.rail button:hover { background: var(--hover); }
.rail button[aria-current="true"] { background: var(--current); font-weight: 700; border-left-color: var(--navy); }
.rail .lbl { flex: 1; }
.rail .amt { font-family: var(--mono); font-size: var(--fs-meta); font-weight: 700; color: var(--mut); }
.rail .amt.bad { color: var(--t-bad-fg); } .rail .amt.warn { color: var(--t-warn-fg); }
@media (max-width: 960px) {
  .rail-body { grid-template-columns: minmax(0,1fr); gap: 12px; }
  .rail { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .railhead { display: none; }
  .rail ul { flex-direction: row; }
  .rail button { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
  .rail button[aria-current="true"] { border-bottom-color: var(--navy); }
}

/* ── panels & tables ────────────────────────────────────────────────── */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.panel + .panel { margin-top: 16px; }
.panel .ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel .pb { padding: 12px 16px; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-size: var(--fs-meta); color: var(--mut); font-weight: 600; padding: 8px 16px; border-bottom: 1px solid var(--line); }
table.list td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list tr:last-child td { border-bottom: 0; }
table.list tr.row:hover td { background: var(--hover); }
table.list .r { text-align: right; }
table.list .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.list .doc { font-family: var(--mono); font-size: var(--fs-small); font-weight: 600; }
table.list .title { font-weight: 600; }
table.list .title .meta { font-weight: 400; display: block; }
.tblwrap { overflow-x: auto; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: var(--fs-meta); font-weight: 700; white-space: nowrap; }
.pill.neutral{background:var(--t-neutral-bg);color:var(--t-neutral-fg)} .pill.faint{background:var(--t-faint-bg);color:var(--t-faint-fg)}
.pill.info{background:var(--t-info-bg);color:var(--t-info-fg)} .pill.good{background:var(--t-good-bg);color:var(--t-good-fg)}
.pill.warn{background:var(--t-warn-bg);color:var(--t-warn-fg)} .pill.accent{background:var(--t-accent-bg);color:var(--t-accent-fg)}
.pill.bad{background:var(--t-bad-bg);color:var(--t-bad-fg)}
.btn { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 6px 12px; font-size: var(--fs-small); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn.primary:hover { background: var(--navy-2); }
.btn.coral { background: var(--coral); color: #fff; border-color: var(--coral); }
.btn.coral:hover { background: var(--coral-2); }
.btn.sm { padding: 3px 9px; font-size: var(--fs-meta); }
.btn:disabled { opacity: .45; cursor: default; }
.link-btn { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; font-size: inherit; }

/* Every money figure is a button into the ledger. Underline only on hover, so
   the page reads as figures and not as a wall of links. */
.fig { background: none; border: 0; padding: 0; font: inherit; font-variant-numeric: tabular-nums; color: inherit; cursor: pointer; border-bottom: 1px dotted transparent; }
.fig:hover { border-bottom-color: currentColor; }
.fig.bad { color: var(--t-bad-fg); } .fig.warn { color: var(--t-warn-fg); } .fig.good { color: var(--t-good-fg); }

/* ── home ───────────────────────────────────────────────────────────── */
.cashline { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; align-items: end; padding: 20px 24px; }
.cashline .big { font-size: var(--fs-figure); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.cashline .big .fig { border-bottom-width: 2px; }
.cashline .since { color: var(--mut); margin-top: 6px; }
.cashline .since b { color: var(--ink); }
.cashline .runway { text-align: right; }
.cashline .runway .n { font-size: var(--fs-metric); font-weight: 700; line-height: 1.1; }
@media (max-width: 640px) { .cashline { grid-template-columns: 1fr; } .cashline .runway { text-align: left; } }
.position { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border-top: 1px solid var(--line); }
.position > div { padding: 14px 24px; }
.position > div + div { border-left: 1px solid var(--line); }
.position .k { font-size: var(--fs-small); color: var(--mut); }
.position .v { font-size: var(--fs-hero); font-weight: 700; margin-top: 2px; }
.position .d { font-size: var(--fs-small); color: var(--mut); margin-top: 2px; }
@media (max-width: 640px) { .position { grid-template-columns: 1fr; } .position > div + div { border-left: 0; border-top: 1px solid var(--line); } }
.decide li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.decide li:last-child { border-bottom: 0; }
.decide ul { list-style: none; margin: 0; padding: 0; }
.decide .why { font-weight: 600; }
.decide .why .meta { display: block; font-weight: 400; }
.decide .amt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.two .panel + .panel { margin-top: 0; }

/* ── pipeline ───────────────────────────────────────────────────────── */
.stages { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 0; }
.stages button { background: none; border: 0; border-right: 1px solid var(--line); padding: 12px 14px; text-align: left; display: block; position: relative; }
.stages button:last-child { border-right: 0; }
.stages button:hover { background: var(--hover); }
.stages button[aria-pressed="true"] { background: var(--current); }
.stages button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--navy); }
.stages .k { font-size: var(--fs-small); color: var(--mut); }
.stages .v { font-size: var(--fs-hero); font-weight: 700; font-variant-numeric: tabular-nums; }
.stages .c { font-size: var(--fs-meta); color: var(--mut); }
.stages .v.bad { color: var(--t-bad-fg); } .stages .v.warn { color: var(--t-warn-fg); } .stages .v.good { color: var(--t-good-fg); }
@media (max-width: 900px) { .stages { grid-template-columns: repeat(3, 1fr); } .stages button { border-bottom: 1px solid var(--line); } }
.bar { height: 6px; background: var(--t-faint-bg); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--navy); }
.bar i.warn { background: var(--t-warn-fg); } .bar i.bad { background: var(--t-bad-fg); } .bar i.good { background: var(--t-good-fg); }

/* ── ledger ─────────────────────────────────────────────────────────── */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: var(--radius); padding: 5px 8px; font: inherit; font-size: var(--fs-small); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--t-accent-bg); color: var(--t-accent-fg); font-size: var(--fs-meta); font-weight: 700; }
.chip button { background: none; border: 0; color: inherit; padding: 0; font-weight: 800; }
tr.entry td { cursor: pointer; }
tr.entry.open td { background: var(--current); }
tr.lines td { background: var(--t-faint-bg); padding: 6px 16px 10px; }
.postings { display: grid; grid-template-columns: max-content max-content max-content; gap: 2px 18px; font-family: var(--mono); font-size: var(--fs-small); }
.postings .cr { padding-left: 24px; }
.balanced { font-family: var(--mono); font-size: var(--fs-meta); }
.balanced.ok { color: var(--t-good-fg); }
.reversed { text-decoration: line-through; color: var(--mut); }

/* ── reports ────────────────────────────────────────────────────────── */
.pl td.ind { padding-left: 32px; }
.pl tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }
.margin .bar { margin-top: 4px; }

/* ── cash / reconciliation / forecast ──────────────────────────────── */
.recon { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); }
.recon > div { padding: 14px 20px; }
.recon > div + div { border-left: 1px solid var(--line); }
.recon .k { font-size: var(--fs-small); color: var(--mut); } .recon .v { font-size: var(--fs-hero); font-weight: 700; margin-top: 2px; } .recon .d { font-size: var(--fs-small); color: var(--mut); margin-top: 2px; }
@media (max-width: 900px) { .recon { grid-template-columns: 1fr 1fr; } .recon > div:nth-child(3) { border-left: 0; } .recon > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
.fc td.wk { white-space: nowrap; }
.fc tr.low td { background: var(--t-warn-bg); }
.fc tr.neg td { background: var(--t-bad-bg); }
.fc .in { color: var(--t-good-fg); } .fc .out { color: var(--t-bad-fg); }
.fc .why { font-size: var(--fs-meta); color: var(--mut); display: block; }
.ghost { border-style: dashed; background: transparent; box-shadow: none; }
.ghost .pb { color: var(--mut); font-size: var(--fs-small); }
.ghost .pb b { color: var(--ink); }
.portal { border: 2px solid var(--sky); border-radius: var(--radius); padding: 14px 16px; margin-top: 12px; background: var(--bg); }
.portal .ph2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.portal .ph2 b { font-size: var(--fs-lead); }
.portal .ph2 .meta { color: var(--t-info-fg); font-weight: 700; }
.portal table { width: 100%; border-collapse: collapse; } .portal td { padding: 6px 0; border-bottom: 1px solid var(--line); }
pre.csv { font-family: var(--mono); font-size: var(--fs-meta); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; overflow: auto; max-height: 60vh; white-space: pre; }
.stand { display: inline-flex; align-items: center; gap: 6px; }
.stand i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stand.good i { background: var(--t-good-fg); } .stand.warn i { background: var(--t-warn-fg); } .stand.bad i { background: var(--t-bad-fg); }

/* ── drawer ─────────────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: rgba(23,42,74,.35); z-index: 30; display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--card); z-index: 31; box-shadow: var(--shadow-md); transform: translateX(100%); transition: transform var(--dur) var(--ease); overflow-y: auto; display: flex; flex-direction: column; }
.drawer.on { transform: none; } .scrim.on { display: block; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer .dh { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
.drawer .dh h2 { font-size: var(--fs-hero); }
.drawer .dh .x { margin-left: auto; background: none; border: 0; font-size: 20px; line-height: 1; color: var(--mut); }
.drawer .db { padding: 16px 20px; }
.drawer .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.drawer .lines td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.drawer .lines { width: 100%; border-collapse: collapse; }
.drawer .lines .cov { color: var(--mut); text-decoration: line-through; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 74px minmax(0,1fr) auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-small); }
.timeline li:last-child { border-bottom: 0; }
.timeline .d { color: var(--mut); font-variant-numeric: tabular-nums; }
.timeline .n { font-variant-numeric: tabular-nums; }
.drawer label { display: block; font-size: var(--fs-small); color: var(--mut); margin-top: 10px; }
.drawer input, .drawer select, .drawer textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: var(--radius); padding: 7px 9px; font: inherit; }
.drawer .form { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; }
.drawer .form h3 { font-size: var(--fs-body); }
.formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: var(--radius); box-shadow: var(--shadow-md); opacity: 0; transition: all var(--dur) var(--ease); z-index: 40; font-size: var(--fs-small); pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast b { color: #FFB59E; }
.empty { padding: 28px 16px; text-align: center; color: var(--mut); }
.note { font-size: var(--fs-small); color: var(--mut); padding: 10px 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="topbar">
  <span class="wordmark">Ridgeline</span>
  <span class="op">Sierra Spectra</span>
  <span class="sp"></span>
  <span class="mock">Financial redesign · interactive mockup · everything before Treasury · Mon 14 Sep 2026</span>
</div>

<div class="wrap">
  <div class="head">
    <div>
      <h1 id="title">Financial</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn sm" id="reset" title="Put the seed data back">Reset data</button>
      <div class="seg" role="group" aria-label="Reporting period" id="period"></div>
    </div>
  </div>

  <div class="rail-body">
    <nav class="rail" aria-label="Financial sections" id="rail"></nav>
    <main id="pane"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Document"></aside>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE THESIS OF THIS MOCKUP
   Every dollar on every screen is SUM() over rows in one append-only
   journal. Nothing stores a balance. Actions post entries; screens re-read.
   Click any figure and the ledger opens filtered to the rows that made it.
   ═══════════════════════════════════════════════════════════════════════ */

const TODAY = "2026-09-14";
const ACCOUNTS = {
  cash:   { name: "Bank",             side: "dr" },
  stripe: { name: "Stripe balance",   side: "dr" },
  ar:     { name: "Receivable",       side: "dr" },
  ap:     { name: "Payable",          side: "cr" },
  dep:    { name: "Deposits held",    side: "cr" },
  tax:    { name: "Sales tax owed",   side: "cr" },
  rev_l:  { name: "Labor revenue",    side: "cr", group: "Revenue" },
  rev_p:  { name: "Parts revenue",    side: "cr", group: "Revenue" },
  rev_t:  { name: "Travel revenue",   side: "cr", group: "Revenue" },
  rev_c:  { name: "Contract revenue", side: "cr", group: "Revenue" },
  fees:   { name: "Late fees",        side: "cr", group: "Revenue" },
  cogs:   { name: "Parts cost",       side: "dr", group: "Cost" },
  ovh:    { name: "Overhead",         side: "dr", group: "Cost" },
  pay:    { name: "Payroll",          side: "dr", group: "Cost" },
  reimb:  { name: "Field expenses",   side: "dr", group: "Cost" },
  pfees:  { name: "Processing fees",  side: "dr", group: "Cost" },
  equity: { name: "Opening balance",  side: "cr" },
};

const $ = (s, r = document) => r.querySelector(s);
const fmt = (c, signed = false) => {
  const neg = c < 0; const v = Math.abs(c);
  const s = "$" + (v / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  f.payrollDue = S.payroll.runs["2026-09"] ? 0 : S.payroll.grossCents;
  f.owes = f.ap + f.reimbDue + f.tax;
  f.periodOut = ["cogs", "ovh", "pay", "reimb", "pfees"].reduce((a, k) => a + sumAcct(k, inPeriod), 0);
  f.unmatched = unmatchedBank().length; f.transit = inTransit().length;
  f.holds = Object.keys(S.clients).filter(c => standing(c).hold);
  const monthlyBurn = ["ovh", "pay", "reimb"].reduce((a, k) => a + sumAcct(k, (e) => e.on >= "2026-07-01" && e.on < "2026-09-01"), 0) / 2;
  f.runwayMonths = monthlyBurn > 0 ? f.cash / monthlyBurn : Infinity;
  f.burn = monthlyBurn;
  return f;
}

/* ── actions: each one posts, then everything re-renders ────────────── */
function act(fn, msg) { try { fn(); } catch (err) { if (err.message === "closed period") { toast("That date is in a closed month. Post it today instead - the record keeps both."); return; } if (err.message === "bank-confirmed") { toast("The bank saw this money move, so it cannot be reversed on our side alone. Correct it with a new entry when the refund or return shows up in the feed."); return; } throw err; } S.ledger.sort((a, b) => a.on < b.on ? -1 : a.on > b.on ? 1 : a.id - b.id); render(); toast(msg); }
const A = {
  sendInvoice: (id) => act(() => S.sendInvoice(id, TODAY), `Sent <b>${id}</b> · posted to Receivable and Revenue`),
  recordPayment: (id, cents, method, refno) => act(() => S.pay(id, TODAY, cents, method, refno), `Recorded ${fmt(cents)} on <b>${id}</b> · Cash / Receivable`),
  postFee: (id) => act(() => {
    const i = S.invoices[id]; const b = balanceOf(id); const days = daysBetween(i.dueOn, TODAY);
    const cents = Math.round(b * 0.015); const fid = "F-" + (i.fees.length + 1);
    i.fees.push({ id: fid, cents, basis: `1.5%/mo on ${fmt(b)} outstanding, ${days} days past due`, on: TODAY, waived: false });
    S.post(TODAY, `Late fee posted on ${id}`, { type: "invoice", id, client: i.client, fee: fid }, [{ acct: "ar", dr: cents }, { acct: "fees", cr: cents }]);
  }, `Posted late fee on <b>${id}</b>`),
  waiveFee: (id, fid) => act(() => {
    const i = S.invoices[id]; const f = i.fees.find(x => x.id === fid); f.waived = true;
    S.post(TODAY, `Late fee waived on ${id}`, { type: "invoice", id, client: i.client, fee: fid }, [{ acct: "fees", dr: f.cents }, { acct: "ar", cr: f.cents }]);
    if (balanceOf(id) <= 0 && i.status !== "draft") i.status = "paid";
  }, `Waived fee on <b>${id}</b> · the charge and the waiver both stay on record`),
  resolveDispute: (id, how) => act(() => {
    const i = S.invoices[id]; const d = i.dispute; i.dispute = null;
    if (how === "credit") {
      i.lines.push({ kind: "parts", desc: "Credit: " + i.lines[d.line].desc + " (warranty)", qty: 1, unit: "ea", unitCents: -d.cents });
      S.post(TODAY, `Credit issued on ${id} · dispute resolved`, { type: "invoice", id, client: i.client }, [{ acct: "rev_p", dr: d.cents }, { acct: "ar", cr: d.cents }]);
      if (balanceOf(id) <= 0) i.status = "paid";
    }
  }, how === "credit" ? `Credited <b>${id}</b> · negative line posted, nothing edited` : `Dispute on <b>${id}</b> closed · line stands`),
  sendRung: (id) => act(() => { const i = S.invoices[id]; const r = ["Reminder", "Statement", "Final notice", "Demand letter"][i.dunning.length] || "Demand letter"; i.dunning.push(`${r} · ${shortDate(TODAY)}`); }, `Sent <b>${id}</b> the next rung · logged`),
  draftFromJob: (id) => act(() => {
    const j = S.jobs[id]; const n = "INV-" + (1049 + Object.keys(S.invoices).filter(k => k > "INV-1048").length);
    S.invoices[n] = { id: n, client: j.client, title: j.title, lines: j.lines.map(l => ({ ...l })), status: "draft", sentOn: "", dueOn: "", fees: [], dispute: null, promise: null, dunning: [], job: id };
    j.status = "invoiced"; j.invoice = n; j.costCents = jobCost(j);
    ui.drawer = { type: "invoice", id: n };
  }, `Drafted invoice from <b>${id}</b> · nothing posts until it is sent`),
  approveQuote: (id) => act(() => {
    const q = S.quotes[id]; q.status = "approved"; q.approvedOn = TODAY;
    const jid = "WO-" + (2208 + Object.keys(S.jobs).filter(k => k > "WO-2207").length);
    S.jobs[jid] = { id: jid, client: q.client, title: q.title, lines: [{ kind: "labor", desc: "Per quote " + id, qty: 1, unit: "job", unitCents: q.cents }], status: "in progress", depositCents: 0, quote: id };
    q.job = jid;
    if (q.depositPct) { const d = Math.round(q.cents * q.depositPct / 100); S.jobs[jid].depositCents = d; S.post(TODAY, `Deposit received on ${id} · card`, { type: "job", id: jid, client: q.client, method: "card" }, [{ acct: "cash", dr: d }, { acct: "dep", cr: d }]); }
  }, `Awarded <b>${id}</b> · job opened${S.quotes[id].depositPct ? ", deposit posted as a liability" : ""}`),
  closeJob: (id) => act(() => { S.jobs[id].status = "closed"; S.jobs[id].closedOn = TODAY; }, `Closed <b>${id}</b> · now sitting in Worked, unbilled`),
  receivePo: (id) => act(() => { const p = S.pos[id]; p.status = "received"; p.receivedOn = TODAY; S.post(TODAY, `${id} received · ${p.vendor}`, { type: "po", id, job: p.job }, [{ acct: "cogs", dr: p.cents }, { acct: "ap", cr: p.cents }]); }, `Received <b>${id}</b> · Parts cost / Payable`),
  payPo: (id) => act(() => { const p = S.pos[id]; p.status = "paid"; p.paidOn = TODAY; S.post(TODAY, `${id} paid · ${p.vendor}`, { type: "po", id, job: p.job }, [{ acct: "ap", dr: p.cents }, { acct: "cash", cr: p.cents }]); }, `Paid <b>${id}</b> · Payable / Cash`),
  payBill: (id) => act(() => S.payBill(id, TODAY), `Paid <b>${S.bills[id].payee}</b> · Overhead / Cash`),
  approveReport: (id) => act(() => { S.reports[id].status = "approved"; }, `Approved <b>${id}</b> · ready to pay`),
  payReport: (id) => act(() => { const r = S.reports[id]; r.status = "paid"; r.paidOn = TODAY; S.post(TODAY, `${id} paid · ${r.person}`, { type: "report", id, job: r.job }, [{ acct: "reimb", dr: r.cents }, { acct: "cash", cr: r.cents }]); }, `Paid <b>${id}</b> to ${S.reports[id].person}`),
  runPayroll: () => act(() => S.runPayroll("2026-09", TODAY), `Ran September payroll · Payroll / Cash`),
  payLink: (id, method) => act(() => S.payByLink(id, TODAY, balanceOf(id), method), `${S.clients[S.invoices[id].client].name} paid <b>${id}</b> by ${method} · gross to Stripe balance, fee posted as its own row`),
  payout: () => act(() => {
    const c = sumAcct("stripe"); if (c <= 0) return;
    const e = S.post(TODAY, "Stripe payout to bank", { type: "payout", id: "PO" + TODAY.replace(/-/g, "") }, [{ acct: "cash", dr: c }, { acct: "stripe", cr: c }]);
    S.bank.push({ id: S.nextBank++, on: TODAY, desc: "STRIPE PAYOUT", cents: c, matched: e.id }); e.bank = S.bank[S.bank.length - 1].id;
  }, `Paid out ${fmt(sumAcct("cash") - 0)} · Bank / Stripe balance · matched to the bank line it will produce`),
  matchBank: (tid, eid) => act(() => { const t = S.bank.find(x => x.id === Number(tid)); const e = S.ledger.find(x => x.id === Number(eid)); t.matched = e.id; e.bank = t.id; }, `Matched bank line to entry <b>#${eid}</b>`),
  recordFromBank: (tid, inv) => act(() => { const t = S.bank.find(x => x.id === Number(tid)); const e = S.pay(inv, t.on, t.cents, "ACH", "from bank feed"); t.matched = e.id; e.bank = t.id; }, `Recorded the bank line as payment on <b>${inv}</b> · Bank / Receivable, matched`),
  postFromBank: (tid, acct, memo) => act(() => { const t = S.bank.find(x => x.id === Number(tid)); const c = Math.abs(t.cents); const lines = t.cents < 0 ? [{ acct, dr: c }, { acct: "cash", cr: c }] : [{ acct: "cash", dr: c }, { acct, cr: c }]; const e = S.post(t.on, memo, { type: "bank", id: "BK-" + t.id }, lines); t.matched = e.id; e.bank = t.id; }, `Posted bank line to <b>${ACCOUNTS[acct].name}</b> · matched`),
  invoiceInstallment: (agr) => act(() => {
    const a = S.agreements[agr]; const n = "INV-" + (1049 + Object.keys(S.invoices).filter(k => k > "INV-1048").length);
    S.invoices[n] = { id: n, client: a.client, title: a.title + " · installment due " + shortDate(a.nextOn), lines: [{ kind: "contract", desc: `PM agreement, ${a.systems} systems, quarter from ${shortDate(a.nextOn)}`, qty: 1, unit: "qtr", unitCents: a.installmentCents }], status: "draft", sentOn: "", dueOn: "", fees: [], dispute: null, promise: null, dunning: [], agreement: agr };
    a.nextOn = addDays(a.nextOn, 91); ui.drawer = { type: "invoice", id: n };
  }, `Drafted the next installment on <b>${agr}</b> · send it and the contract revenue posts`),
  overrideHold: (cid, reason) => act(() => { S.clients[cid].overrides.push({ reason, on: TODAY, by: "Joe", until: addDays(TODAY, 14) }); }, `Override on <b>${S.clients[cid].name}</b> for 14 days · reason kept`),
  liftOverride: (cid) => act(() => { for (const o of S.clients[cid].overrides) o.lifted = true; }, `Override lifted on <b>${S.clients[cid].name}</b>`),
  remitTax: () => act(() => { const c = sumAcct("tax"); if (c <= 0) return; S.post(TODAY, "Sales tax remitted · CDTFA", { type: "tax", id: "Q3-2026" }, [{ acct: "tax", dr: c }, { acct: "cash", cr: c }]); }, `Remitted sales tax · Sales tax owed / Bank`),
  closePeriod: (ym) => act(() => { S.closedThrough = ym; }, `Closed the books through <b>${ym}</b> · nothing before it can be posted to again; corrections land in the open month`),
  reopen: () => act(() => { S.closedThrough = "2026-07"; }, `Reopened August`),
  reverse: (eid) => act(() => {
    const e = S.ledger.find(x => x.id === eid); if (!e || e.reversed) return;
    if (e.bank) throw new Error("bank-confirmed");
    e.reversed = true;
    S.post(TODAY, `Reversal of #${e.id} · ${e.memo}`, { ...e.ref, reversal: true }, e.lines.map(l => ({ acct: l.acct, dr: l.cr, cr: l.dr })), { reverses: e.id });
    if (e.ref.type === "invoice" && S.invoices[e.ref.id]) { const i = S.invoices[e.ref.id]; if (i.status !== "draft") i.status = balanceOf(i.id) <= 0 ? "paid" : balanceOf(i.id) < invTotal(i) ? "partial" : "sent"; }

/* ── rendering ──────────────────────────────────────────────────────── */
const ROOMS = [
  { key: "home", label: "Home", group: "Position" },
  { key: "cash", label: "Cash", group: "Position" },
  { key: "receivables", label: "Receivables", group: "Money" },
  { key: "payables", label: "Payables", group: "Money" },
  { key: "clients", label: "Clients", group: "Money" },
  { key: "ledger", label: "Ledger", group: "Record" },
  { key: "reports", label: "Reports", group: "Record" },
];
const SUBS = {
  home: () => `Sierra Spectra · cash, position, and what needs deciding · ${periodLabel()}`,
  cash: () => `Bank against books, and the next eight weeks`,
  clients: () => `Who owes what, who is on hold, and what they see`,
  receivables: () => `Everything owed to the shop, from quote to paid · ${periodLabel()}`,
  payables: () => `Everything the shop owes, and when · ${periodLabel()}`,

  reports: () => `Derived from the ledger, nothing typed · ${periodLabel()}`,
};

function fig(cents, filter, tone = "", label) {
  const t = tone ? ` ${tone}` : "";
  return `<button class="fig${t}" data-filter='${esc(JSON.stringify(filter))}' title="Show the ledger rows behind this figure">${label ?? fmt(cents)}</button>`;
}
function pill(status) {
  const m = { draft: ["faint", "Draft"], sent: ["info", "Sent"], partial: ["warn", "Partial"], paid: ["good", "Paid"], approved: ["accent", "Awarded"], expired: ["faint", "Expired"], received: ["warn", "Received"], "in progress": ["info", "In work"], closed: ["warn", "Unbilled"], submitted: ["warn", "Awaiting approval"], "paid-r": ["good", "Paid"] };
  const [tone, label] = m[status] || ["neutral", status];
  return `<span class="pill ${tone}">${label}</span>`;
}

function render() {
  const f = figures();
  $("#sub").textContent = SUBS[ui.room]();
  $("#period").innerHTML = ["month", "quarter", "ytd"].map(p => `<button aria-pressed="${ui.period === p}" data-p="${p}">${{ month: "This month", quarter: "Quarter", ytd: "Year to date" }[p]}</button>`).join("");
  const amounts = { receivables: [f.ar, f.pastDue > 0 ? "bad" : ""], payables: [f.owes, ""], cash: [f.cash, ""], clients: [f.holds.length ? f.holds.length : null, "bad"], ledger: [null], reports: [null], home: [null] };
  let rail = ""; let g = "";
  for (const r of ROOMS) {
    if (r.group !== g) { if (g) rail += "</ul>"; rail += `<div class="railhead">${r.group}</div><ul>`; g = r.group; }
    const [c, tone] = amounts[r.key];
    rail += `<li><button aria-current="${ui.room === r.key}" data-room="${r.key}"><span class="lbl">${r.label}</span>${c ? `<span class="amt ${tone}">${r.key === "clients" ? c + " on hold" : fmtK(c)}</span>` : ""}</button></li>`;
  }
  $("#rail").innerHTML = rail + "</ul>";
  $("#pane").innerHTML = ({ home: rHome, cash: rCash, receivables: rRecv, payables: rPay, clients: rClients, ledger: rLedger, reports: rReports })[ui.room](f);
  renderDrawer();
}

/* Home */
function rHome(f) {
  const decisions = [];
  for (const i of Object.values(S.invoices)) {
    if (i.status === "draft") decisions.push({ why: `Send ${i.id}`, meta: `${S.clients[i.client].name} · drafted, nothing posted yet`, cents: invTotal(i), btn: `<button class="btn sm primary" data-act="sendInvoice" data-id="${i.id}">Send</button>`, open: ["invoice", i.id] });
    if ((i.status === "sent" || i.status === "partial") && i.dueOn < TODAY) {
      const b = balanceOf(i.id); const days = daysBetween(i.dueOn, TODAY);
      const broken = i.promise && i.promise.on < TODAY;
      decisions.push({ why: `${i.id} is ${days} days past due`, meta: `${S.clients[i.client].name}${broken ? ` · promise for ${shortDate(i.promise.on)} broken` : ""}${i.dispute ? " · one line disputed" : ""}`, cents: b, tone: "bad", btn: i.dispute ? `<button class="btn sm" data-open="invoice:${i.id}">Resolve dispute</button>` : `<button class="btn sm coral" data-act="sendRung" data-id="${i.id}">Send next rung</button>`, open: ["invoice", i.id] });
    }
  }
  for (const j of Object.values(S.jobs)) if (j.status === "closed") decisions.push({ why: `${j.id} closed ${daysBetween(j.closedOn, TODAY)} days ago, not billed`, meta: `${S.clients[j.client].name} · ${j.title} · the leak`, cents: jobValue(j), tone: "warn", btn: `<button class="btn sm primary" data-act="draftFromJob" data-id="${j.id}">Draft invoice</button>`, open: ["job", j.id] });
  for (const r of Object.values(S.reports)) if (r.status === "submitted") decisions.push({ why: `${r.person} is waiting on ${r.id}`, meta: r.title + ` · submitted ${shortDate(r.submittedOn)}`, cents: r.cents, btn: `<button class="btn sm" data-act="approveReport" data-id="${r.id}">Approve</button>`, open: ["report", r.id] });
  else if (r.status === "approved") decisions.push({ why: `Pay ${r.id} to ${r.person}`, meta: r.title + " · approved", cents: r.cents, btn: `<button class="btn sm primary" data-act="payReport" data-id="${r.id}">Pay</button>`, open: ["report", r.id] });
  for (const b of Object.values(S.bills)) if (!b.paid["2026-09"]) { const due = `2026-09-${String(b.day).padStart(2, "0")}`; const d = daysBetween(TODAY, due); decisions.push({ why: `${b.payee} due ${d === 0 ? "today" : d < 0 ? Math.abs(d) + " days ago" : "in " + d + " days"}`, meta: b.kind + " · " + fmt(b.cents) + " monthly", cents: b.cents, tone: d < 0 ? "bad" : d <= 3 ? "warn" : "", btn: `<button class="btn sm" data-act="payBill" data-id="${b.id}">Pay</button>` }); }
  for (const p of Object.values(S.pos)) if (p.status === "received") decisions.push({ why: `Pay ${p.vendor} for ${p.id}`, meta: p.title + ` · received ${shortDate(p.receivedOn)}`, cents: p.cents, btn: `<button class="btn sm" data-act="payPo" data-id="${p.id}">Pay</button>`, open: ["po", p.id] });
  if (f.unmatched) decisions.push({ why: `${f.unmatched} bank line${f.unmatched === 1 ? " has" : "s have"} no entry`, meta: "the bank says money moved and the books do not - reconcile", cents: unmatchedBank().reduce((a, t) => a + Math.abs(t.cents), 0), tone: "warn", btn: `<button class="btn sm primary" data-room="cash">Reconcile</button>` });
  if (f.stripe > 0) decisions.push({ why: `${fmt(f.stripe)} sitting in Stripe`, meta: "collected by pay link, not yet in the bank", cents: f.stripe, btn: `<button class="btn sm" data-act="payout">Pay out</button>` });
  for (const a of Object.values(S.agreements)) if (daysBetween(TODAY, a.nextOn) <= 21) decisions.push({ why: `${S.clients[a.client].name} installment due ${shortDate(a.nextOn)}`, meta: a.title + " · the next quarter, not yet drafted", cents: a.installmentCents, btn: `<button class="btn sm" data-act="invoiceInstallment" data-id="${a.id}">Draft it</button>` });

      <div><div class="k">Position</div><div class="v money ${net < 0 ? "fig bad" : ""}">${fmt(net)}</div><div class="d">receivable less payable, right now. ${fmt(f.dep)} held in deposits is not yours yet.</div></div>

      <div class="tblwrap"><table class="list"><tbody>
