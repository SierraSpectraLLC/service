        <tr><td>Overhead</td><td class="meta">rent, insurance, telecom, software</td><td class="num">${fig(sumAcct("ovh", inPeriod), { acct: "ovh", period: true })}</td></tr>
        <tr><td>Payroll</td><td class="meta">${S.payroll.runs["2026-09"] ? "September run posted" : "September not yet run"}</td><td class="num">${fig(sumAcct("pay", inPeriod), { acct: "pay", period: true })}</td></tr>
        <tr><td>Field expenses</td><td class="meta">reimbursed to engineers</td><td class="num">${fig(sumAcct("reimb", inPeriod), { acct: "reimb", period: true })}</td></tr>
        <tr><td>Processing fees</td><td class="meta">Stripe, on pay-link payments</td><td class="num">${fig(sumAcct("pfees", inPeriod), { acct: "pfees", period: true })}</td></tr>
        <tr><td>On order, not yet a cost</td><td class="meta">POs sent, not received</td><td class="num">${fmt(f.onOrder)}</td></tr>
      </tbody></table></div>
    </div>
  </div>`;
}

/* Receivables — one pipeline, six stages, one list */
function rRecv(f) {
  const stages = [
    { k: "quoted", label: "Quoted", cents: f.quoted, n: f.quotedN },
    { k: "awarded", label: "Awarded, in work", cents: f.awarded, n: f.awardedN },
    { k: "unbilled", label: "Worked, unbilled", cents: f.unbilled, n: f.unbilledN, tone: f.unbilled ? "warn" : "" },
    { k: "current", label: "Invoiced, in terms", cents: f.current, n: f.currentN },
    { k: "pastdue", label: "Past due", cents: f.pastDue, n: f.pastDueN, tone: f.pastDue ? "bad" : "" },
    { k: "paid", label: "Paid, " + (ui.period === "month" ? "this month" : ui.period === "ytd" ? "YTD" : "this quarter"), cents: f.collected, n: f.collectedN, tone: "good" },
  ];
  const rows = [];
  const cl = (id) => S.clients[id].name;
  for (const q of Object.values(S.quotes)) if (q.status === "sent") rows.push({ stage: "quoted", status: "sent", client: cl(q.client), doc: q.id, title: q.title, meta: `sent ${shortDate(q.sentOn)} · expires ${shortDate(q.expiresOn)}${q.depositPct ? ` · ${q.depositPct}% deposit on approval` : ""}`, cents: q.cents, sort: q.expiresOn, act: `<button class="btn sm" data-act="approveQuote" data-id="${q.id}">Mark approved</button>`, open: "quote:" + q.id });
  for (const j of Object.values(S.jobs)) {
    if (j.status === "in progress") rows.push({ stage: "awarded", status: "in progress", client: cl(j.client), doc: j.id, title: j.title, meta: `from ${j.quote}${j.depositCents ? ` · ${fmt(j.depositCents)} deposit held, applies on invoice` : ""}`, cents: jobValue(j) - (j.depositCents || 0), sort: "z", act: `<button class="btn sm" data-act="closeJob" data-id="${j.id}">Close job</button>`, open: "job:" + j.id });
    if (j.status === "closed") rows.push({ stage: "unbilled", status: "closed", client: cl(j.client), doc: j.id, title: j.title, meta: `closed ${shortDate(j.closedOn)} · ${daysBetween(j.closedOn, TODAY)} days unbilled`, cents: jobValue(j), tone: "warn", sort: j.closedOn, act: `<button class="btn sm primary" data-act="draftFromJob" data-id="${j.id}">Draft invoice</button>`, open: "job:" + j.id });
  }
  for (const i of Object.values(S.invoices)) {
    const b = balanceOf(i.id);
    if (i.status === "draft") rows.push({ stage: "unbilled", status: "draft", client: cl(i.client), doc: i.id, title: i.title, meta: "draft · nothing posted until sent", cents: invTotal(i), tone: "warn", sort: "0", act: `<button class="btn sm primary" data-act="sendInvoice" data-id="${i.id}">Send</button>`, open: "invoice:" + i.id });
    else if ((i.status === "sent" || i.status === "partial") && b > 0) {
      const past = i.dueOn < TODAY; const d = daysBetween(i.dueOn, TODAY);
      rows.push({ stage: past ? "pastdue" : "current", status: i.status, client: cl(i.client), doc: i.id, title: i.title, meta: past ? `${d} days past due · ${i.dunning.length} rungs sent${i.dispute ? " · dispute open" : ""}${i.promise ? ` · promised ${shortDate(i.promise.on)}` : ""}` : `due ${shortDate(i.dueOn)} · ${-d} days${i.status === "partial" ? " · partly paid" : ""}`, cents: b, tone: past ? "bad" : "", sort: i.dueOn, act: past ? (i.dispute ? `<button class="btn sm" data-open="invoice:${i.id}">Resolve dispute</button>` : `<button class="btn sm coral" data-act="sendRung" data-id="${i.id}">Send next rung</button>`) : `<button class="btn sm" data-open="invoice:${i.id}">Record payment</button>`, open: "invoice:" + i.id });
    }
    else if (i.status === "paid") { const last = [...S.ledger].reverse().find(e => e.ref.type === "invoice" && e.ref.id === i.id && e.lines.some(l => l.acct === "cash")); if (last && inPeriod(last)) rows.push({ stage: "paid", status: "paid", client: cl(i.client), doc: i.id, title: i.title, meta: `paid ${shortDate(last.on)}`, cents: invTotal(i), tone: "good", sort: last.on, act: "", open: "invoice:" + i.id }); }
  }
  const order = { pastdue: 0, unbilled: 1, current: 2, awarded: 3, quoted: 4, paid: 5 };
  rows.sort((a, b) => order[a.stage] - order[b.stage] || (a.sort < b.sort ? -1 : 1));
  const shown = ui.stage ? rows.filter(r => r.stage === ui.stage) : rows;
  // By client, so the pipeline can also be read as who owes what.
  const byClient = {};
  for (const r of rows) { if (r.stage === "paid" || r.stage === "quoted") continue; byClient[r.client] = (byClient[r.client] || 0) + r.cents; }
  const maxC = Math.max(1, ...Object.values(byClient));
  return `
  <div class="panel">
    <div class="stages">${stages.map(s => `<button aria-pressed="${ui.stage === s.k}" data-stage="${s.k}"><div class="k">${s.label}</div><div class="v ${s.tone || ""}">${fmt(s.cents)}</div><div class="c">${s.n} ${s.k === "paid" ? "payment" : s.k === "quoted" ? "quote" : s.k === "awarded" || s.k === "unbilled" ? "job" : "invoice"}${s.n === 1 ? "" : "s"}</div></button>`).join("")}</div>
    <div class="note">Left to right is the order money moves. Quotes and unbilled work are not in the ledger yet - they are the pipeline's promise, not its record. Tap a stage to filter; tap it again to clear.</div>
  </div>
  <div class="panel">
    <div class="ph"><h2>${ui.stage ? stages.find(s => s.k === ui.stage).label : "The whole pipeline"} <span class="meta">${shown.length} rows</span></h2>${ui.stage ? `<span class="chip">${stages.find(s => s.k === ui.stage).label} <button data-stage="${ui.stage}" aria-label="Clear">×</button></span>` : ""}</div>
    <div class="tblwrap"><table class="list"><thead><tr><th>Client</th><th>Document</th><th>What</th><th class="r">Amount</th><th></th></tr></thead><tbody>
    ${shown.map(r => `<tr class="row"><td>${r.client}</td><td><button class="link-btn doc" data-open="${r.open}">${r.doc}</button><br><span class="meta">${pill(r.status)}</span></td><td class="title">${r.title}<span class="meta">${r.meta}</span></td><td class="num ${r.tone ? "fig " + r.tone : ""}">${fmt(r.cents)}</td><td class="r">${r.act}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Nothing at this stage.</td></tr>`}
    </tbody></table></div>
  </div>
  <div class="panel margin">
    <div class="ph"><h2>Exposure by client</h2><span class="meta">awarded + unbilled + invoiced, excluding quotes and paid</span></div>
    <div class="tblwrap"><table class="list"><tbody>${Object.entries(byClient).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td style="width:40%">${c}</td><td><div class="bar"><i style="width:${v / maxC * 100}%"></i></div></td><td class="num">${fmt(v)}</td></tr>`).join("")}</tbody></table></div>
  </div>`;
}

/* Payables — one queue, by when */
function rPay(f) {
  const rows = [];
  for (const b of Object.values(S.bills)) if (!b.paid["2026-09"]) rows.push({ when: `2026-09-${String(b.day).padStart(2, "0")}`, payee: b.payee, kind: "Bill · " + b.kind, doc: b.id, title: "Monthly, every " + b.day + (b.day === 1 ? "st" : b.day === 15 ? "th" : "th"), cents: b.cents, status: "due", act: `<button class="btn sm" data-act="payBill" data-id="${b.id}">Pay</button>` });
  for (const p of Object.values(S.pos)) {
    if (p.status === "received") rows.push({ when: addDays(p.receivedOn, 30), payee: p.vendor, kind: "Purchase order", doc: p.id, title: p.title + (p.job ? ` · for ${p.job}` : ""), cents: p.cents, status: "owed", act: `<button class="btn sm" data-act="payPo" data-id="${p.id}">Pay</button>`, open: "po:" + p.id });
    if (p.status === "sent") rows.push({ when: p.expectedOn, payee: p.vendor, kind: "Purchase order", doc: p.id, title: p.title + ` · expected ${shortDate(p.expectedOn)}`, cents: p.cents, status: "on order", act: `<button class="btn sm" data-act="receivePo" data-id="${p.id}">Mark received</button>`, open: "po:" + p.id });
  }
  for (const r of Object.values(S.reports)) if (r.status !== "paid") rows.push({ when: r.submittedOn, payee: r.person, kind: "Reimbursement", doc: r.id, title: r.title, cents: r.cents, status: r.status === "approved" ? "owed" : "to approve", act: r.status === "approved" ? `<button class="btn sm primary" data-act="payReport" data-id="${r.id}">Pay</button>` : `<button class="btn sm" data-act="approveReport" data-id="${r.id}">Approve</button>`, open: "report:" + r.id });
  if (f.tax > 0) rows.push({ when: "2026-10-31", payee: "CDTFA", kind: "Sales tax", doc: "Q3 2026", title: "Collected on parts sold, owed to the state", cents: f.tax, status: "accruing", act: `<button class="btn sm" data-act="remitTax">Remit</button>` });
  if (!S.payroll.runs["2026-09"]) rows.push({ when: "2026-09-30", payee: "3 people", kind: "Payroll", doc: "Sep 2026", title: "Gross, salaried + hourly", cents: S.payroll.grossCents, status: "scheduled", act: `<button class="btn sm" data-act="runPayroll">Run</button>` });
  rows.sort((a, b) => a.when < b.when ? -1 : 1);
  const tone = { due: "warn", owed: "warn", "to approve": "neutral", "on order": "faint", scheduled: "info", accruing: "info" };
  const owedNow = rows.filter(r => r.status === "owed" || r.status === "due" || r.status === "to approve").reduce((a, r) => a + r.cents, 0);
  const committed = rows.filter(r => r.status === "on order" || r.status === "scheduled").reduce((a, r) => a + r.cents, 0);
  const paid = ["cogs", "ovh", "pay", "reimb", "pfees"].map(k => [k, sumAcct(k, inPeriod)]);
  return `
  <div class="panel">
    <div class="position" style="border-top:0">
      <div><div class="k">Owed now</div><div class="v money">${fig(f.ap, { acct: "ap" }, "", fmt(owedNow))}</div><div class="d">vendors, bills due, and your own people</div></div>
      <div><div class="k">Committed, not yet owed</div><div class="v money">${fmt(committed)}</div><div class="d">POs on order and payroll not yet run - not in the ledger</div></div>
      <div><div class="k">Paid out · ${periodLabel()}</div><div class="v money">${fig(f.periodOut, { acct: "cash", side: "cr", period: true })}</div><div class="d">${paid.map(([k, v]) => `${ACCOUNTS[k].name.toLowerCase()} ${fmtK(v)}`).join(" · ")}</div></div>
    </div>
  </div>
  <div class="panel">
    <div class="ph"><h2>What goes out, in order</h2><span class="meta">${rows.length} items · a purchase order and a bill are the same question</span></div>
    <div class="tblwrap"><table class="list"><thead><tr><th>When</th><th>Payee</th><th>What</th><th class="r">Amount</th><th></th></tr></thead><tbody>
    ${rows.map(r => { const d = daysBetween(TODAY, r.when); return `<tr class="row"><td class="num" style="text-align:left">${shortDate(r.when)}<br><span class="meta">${d < 0 ? Math.abs(d) + "d late" : d === 0 ? "today" : "in " + d + "d"}</span></td><td>${r.payee}<br><span class="meta">${r.kind}</span></td><td class="title">${r.open ? `<button class="link-btn doc" data-open="${r.open}">${r.doc}</button>` : `<span class="doc">${r.doc}</span>`} <span class="pill ${tone[r.status]}">${r.status}</span><span class="meta">${r.title}</span></td><td class="num">${fmt(r.cents)}</td><td class="r">${r.act}</td></tr>`; }).join("") || `<tr><td colspan="5" class="empty">Nothing owed. Enjoy it.</td></tr>`}
    </tbody></table></div>
  </div>`;
}

/* Cash — bank against books, then the next eight weeks */
function rCash(f) {
  const unm = unmatchedBank(); const trans = inTransit(); const bankBal = bankBalance();
  const diff = f.bank - bankBal;
  const cand = (t) => S.ledger.filter(e => !e.bank && live(e) && e.ref.type !== "opening" && e.lines.some(l => l.acct === "cash" && ((l.dr || 0) - (l.cr || 0)) === t.cents) && Math.abs(daysBetween(e.on, t.on)) <= 7);
  const invMatch = (t) => t.cents > 0 ? Object.values(S.invoices).filter(i => (i.status === "sent" || i.status === "partial") && balanceOf(i.id) === t.cents) : [];
  const feed = [...S.bank].reverse().slice(0, 14);
  // Forecast: only what is committed. No quotes, no hopes.
  const weeks = []; let bal = f.cash;
  for (let w = 0; w < 8; w++) {
    const from = addDays(TODAY, w * 7), to = addDays(TODAY, w * 7 + 6); const ins = [], outs = [];
    const inWin = (d) => d >= from && d <= to;
    for (const i of Object.values(S.invoices)) { if (i.status !== "sent" && i.status !== "partial") continue; const b = balanceOf(i.id); if (b <= 0) continue; const exp = i.dueOn < TODAY ? addDays(TODAY, 14) : i.dueOn; if (inWin(exp)) ins.push([b, `${i.id}${i.dueOn < TODAY ? " (past due, assumed 2 wks)" : ""}`]); }
    for (const a of Object.values(S.agreements)) { const due = addDays(a.nextOn, S.clients[a.client].terms); if (inWin(due)) ins.push([a.installmentCents, `${a.id} installment`]); }
    for (const m of ["2026-09", "2026-10", "2026-11"]) { for (const b of Object.values(S.bills)) { if (b.paid[m]) continue; const d = `${m}-${String(b.day).padStart(2, "0")}`; if (d >= TODAY && inWin(d)) outs.push([b.cents, b.payee]); } const pr = `${m}-30`; if (!S.payroll.runs[m] && pr >= TODAY && inWin(pr)) outs.push([S.payroll.grossCents, "Payroll"]); }
    for (const p of Object.values(S.pos)) { const d = p.status === "received" ? addDays(p.receivedOn, 30) : p.status === "sent" ? addDays(p.expectedOn, 30) : null; if (d && inWin(d)) outs.push([p.cents, `${p.id} ${p.vendor}`]); }
    for (const r of Object.values(S.reports)) if (r.status !== "paid" && w === 0) outs.push([r.cents, `${r.id} ${r.person}`]);
    if (f.tax > 0 && inWin("2026-10-31")) outs.push([f.tax, "Sales tax"]);
    const tin = ins.reduce((a, x) => a + x[0], 0), tout = outs.reduce((a, x) => a + x[0], 0); bal += tin - tout;
    weeks.push({ from, to, ins, outs, tin, tout, bal });
  }
  const low = Math.min(...weeks.map(w => w.bal)); const lowIdx = weeks.findIndex(w => w.bal === low);
  return `
  <div class="panel"><div class="recon">
    <div><div class="k">Books say</div><div class="v money">${fig(f.bank, { acct: "cash" })}</div><div class="d">Bank account, from the ledger</div></div>
    <div><div class="k">Bank says</div><div class="v money">${fmt(bankBal)}</div><div class="d">statement balance from the feed</div></div>
    <div><div class="k">Difference</div><div class="v money ${diff ? "fig warn" : "fig good"}">${fmt(diff)}</div><div class="d">${unm.length} bank line${unm.length === 1 ? "" : "s"} unposted · ${trans.length} entr${trans.length === 1 ? "y" : "ies"} not yet at the bank</div></div>
    <div><div class="k">In Stripe</div><div class="v money">${fig(f.stripe, { acct: "stripe" })}</div><div class="d">${f.stripe > 0 ? `<button class="btn sm" data-act="payout">Pay out to bank</button>` : "nothing waiting"}</div></div>
  </div><div class="note">Reconciled means every bank line has an entry and every cash entry has a bank line. The difference is not a rounding error to absorb; it is the list below.</div></div>
  <div class="panel">
    <div class="ph"><h2>Bank feed</h2><span class="meta">${unm.length ? unm.length + " need a home" : "everything has a home"} · read-only feed, no money moves from here</span></div>
    <div class="tblwrap"><table class="list"><thead><tr><th>Date</th><th>Bank description</th><th class="r">Amount</th><th>Books</th><th></th></tr></thead><tbody>
    ${feed.map(t => {
      const e = t.matched ? S.ledger.find(x => x.id === t.matched) : null;
      if (e) return `<tr><td class="num" style="text-align:left">${shortDate(t.on)}</td><td class="doc">${esc(t.desc)}</td><td class="num ${t.cents < 0 ? "" : "fig good"}">${fmt(t.cents, true)}</td><td colspan="2"><span class="pill good">matched</span> <span class="meta">#${e.id} · ${esc(e.memo)}</span></td></tr>`;
      const cs = cand(t), im = invMatch(t);
      let act = "";
      if (cs.length) act = cs.map(c => `<button class="btn sm primary" data-act="matchBank" data-id="${t.id}" data-entry="${c.id}">Match #${c.id}</button>`).join(" ");
      else if (im.length) act = im.map(i => `<button class="btn sm primary" data-act="recordFromBank" data-id="${t.id}" data-inv="${i.id}">Payment on ${i.id}</button>`).join(" ");
      else if (t.cents < 0) act = `<select data-postsel="${t.id}"><option value="">Post as…</option><option value="ovh">Overhead</option><option value="reimb">Field expense</option><option value="cogs">Parts cost</option><option value="pfees">Bank/processing fee</option></select>`;
      else act = `<button class="btn sm" data-act="postFromBank" data-id="${t.id}" data-acct="fees" data-memo="Unidentified deposit">Post as other income</button>`;
      return `<tr><td class="num" style="text-align:left">${shortDate(t.on)}</td><td class="doc">${esc(t.desc)}</td><td class="num ${t.cents < 0 ? "" : "fig good"}">${fmt(t.cents, true)}</td><td><span class="pill warn">no entry</span>${im.length ? ` <span class="meta">equals the balance on ${im[0].id}</span>` : cs.length ? ` <span class="meta">looks like #${cs[0].id}</span>` : ""}</td><td class="r">${act}</td></tr>`;
    }).join("")}
    </tbody></table></div>
    ${trans.length ? `<div class="note">Not yet at the bank: ${trans.map(e => `<b>#${e.id}</b> ${esc(e.memo)} (${fmt(e.lines.find(l => l.acct === "cash").dr || e.lines.find(l => l.acct === "cash").cr)})`).join(" · ")}. A check in the mail is still a fact in the books; the bank just has not seen it.</div>` : ""}
  </div>
  <div class="panel fc">
    <div class="ph"><h2>Next eight weeks</h2><span class="meta">from what is committed: invoices by due date, bills, payroll, POs · quotes and unbilled work deliberately excluded</span></div>
    <div class="tblwrap"><table class="list"><thead><tr><th>Week</th><th class="r">In</th><th class="r">Out</th><th class="r">Ending cash</th></tr></thead><tbody>
    ${weeks.map((w, i) => `<tr class="${w.bal < 0 ? "neg" : i === lowIdx && low < f.cash ? "low" : ""}"><td class="wk">${shortDate(w.from)} – ${shortDate(w.to)}${i === 0 ? '<span class="why">this week</span>' : ""}</td><td class="num in">${w.tin ? "+" + fmt(w.tin) : ""}${w.ins.map(x => `<span class="why">${esc(x[1])}</span>`).join("")}</td><td class="num out">${w.tout ? "−" + fmt(w.tout) : ""}${w.outs.map(x => `<span class="why">${esc(x[1])}</span>`).join("")}</td><td class="num"><b>${fmt(w.bal)}</b>${i === lowIdx && low < f.cash ? '<span class="why">low point</span>' : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="note">Low point ${fmt(low)} in the week of ${shortDate(weeks[lowIdx].from)}. If that number is too close, the levers are all on this page's neighbours: chase what is past due, draft what is unbilled, hold a PO.</div>
  </div>
  <div class="panel ghost">
    <div class="pb"><b>Not until Craton.</b> Everything above works with a read-only bank feed and Stripe Connect: the bank is someone else's, the books are ours, and reconciling is how the two agree. What needs Stripe Treasury is the other half - an operating account that <em>is</em> the ledger (no reconciliation, because there is no second book), cards for engineers and jobs, funded pockets for allowances, and escrow for broker deals. Those are drawn here as the line, not as rooms.</div>
  </div>`;
}

/* Clients — standing, exposure, allowances, and what they see */
function rClients() {
  const rows = Object.values(S.clients).map(c => { const st = standing(c.id); const agr = Object.values(S.agreements).find(a => a.client === c.id); const open = Object.values(S.invoices).filter(i => i.client === c.id && (i.status === "sent" || i.status === "partial") && balanceOf(i.id) > 0).length; const quoted = Object.values(S.quotes).filter(q => q.client === c.id && q.status === "sent").reduce((a, q) => a + q.cents, 0); return { c, st, agr, open, quoted }; });
  rows.sort((a, b) => ({ bad: 0, warn: 1, good: 2 })[a.st.tone] - ({ bad: 0, warn: 1, good: 2 })[b.st.tone] || b.st.owed - a.st.owed);
  return `
  <div class="panel">
    <div class="ph"><h2>Standing</h2><span class="meta">hold at ${holdDays} days past due · the scheduler reads this, not a person</span></div>
    <div class="tblwrap"><table class="list"><thead><tr><th>Client</th><th>Standing</th><th class="r">Owes</th><th>Terms</th><th>Agreement</th><th class="r">Quoted</th><th></th></tr></thead><tbody>
    ${rows.map(({ c, st, agr, open, quoted }) => `<tr class="row"><td><button class="link-btn" style="font-weight:600;text-decoration:none;color:inherit" data-open="client:${c.id}">${c.name}</button><br><span class="meta">${c.contact}</span></td><td><span class="stand ${st.tone}"><i></i>${st.label}</span>${st.override ? `<br><span class="meta">until ${shortDate(st.override.until)}: ${esc(st.override.reason)}</span>` : ""}</td><td class="num ${st.tone === "bad" ? "fig bad" : ""}">${fmt(st.owed)}<br><span class="meta">${open} open</span></td><td>Net ${c.terms}<br><span class="meta">tax ${(c.taxBps / 100).toFixed(2)}%</span></td><td>${agr ? `${agr.id}<br><span class="meta">allowance ${fmt(agr.allowanceCents - agr.allowanceUsed)} left of ${fmt(agr.allowanceCents)}</span>` : '<span class="meta">time and materials</span>'}</td><td class="num">${quoted ? fmt(quoted) : ""}</td><td class="r"><button class="btn sm" data-open="client:${c.id}">Statement</button></td></tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="panel ghost"><div class="pb"><b>What the client gets today:</b> a statement, a pay link on every invoice, a place to question a line, and their allowance balance - all buildable on Connect. <b>What waits for Craton:</b> a funded pocket they can watch draw down, and escrow on an instrument purchase through a broker.</div></div>`;
}

/* Ledger — the journal itself */
function rLedger() {
  const F = ui.ledgerFilter || {};
  const match = (e) => {
    if (F.acct && !e.lines.some(l => l.acct === F.acct && (!F.side || (F.side === "cr" ? l.cr : l.dr)))) return false;
    if (F.type && e.ref.type !== F.type) return false;
    if (F.id && e.ref.id !== F.id) return false;
    if (F.client && e.ref.client !== F.client) return false;
    if (F.period && !inPeriod(e)) return false;
    if (F.status) { const i = S.invoices[e.ref.id]; if (!i || e.ref.type !== "invoice") return false; const past = i.dueOn < TODAY; const open = (i.status === "sent" || i.status === "partial") && balanceOf(i.id) > 0; if (!open) return false; if (F.status === "pastdue" && !past) return false; if (F.status === "current" && past) return false; }
    if (F.q) { const q = F.q.toLowerCase(); if (!(e.memo.toLowerCase().includes(q) || String(e.ref.id || "").toLowerCase().includes(q))) return false; }
    return true;
  };
  const rows = S.ledger.filter(match).slice().reverse();
  let dr = 0, cr = 0; for (const e of rows) for (const l of e.lines) { dr += l.dr || 0; cr += l.cr || 0; }
  const figSum = F.acct ? sumAcct(F.acct, match) : null;
  const desc = [];
  if (F.acct) desc.push(ACCOUNTS[F.acct].name + (F.side === "cr" ? " (out)" : ""));
  if (F.status) desc.push(F.status === "pastdue" ? "past-due invoices" : "invoices in terms");
  if (F.type) desc.push({ invoice: "invoices", job: "jobs", po: "purchase orders", bill: "bills", report: "reimbursements", payroll: "payroll" }[F.type]);
  if (F.id) desc.push(F.id); if (F.client) desc.push(S.clients[F.client].name); if (F.period) desc.push(periodLabel());
  const accts = Object.entries(ACCOUNTS);
  return `
  <div class="panel">
    <div class="ph">
      <div class="filters">
        <select id="lf-acct"><option value="">Any account</option>${accts.map(([k, a]) => `<option value="${k}" ${F.acct === k ? "selected" : ""}>${a.name}</option>`).join("")}</select>
        <select id="lf-type"><option value="">Any document</option>${["invoice", "job", "po", "bill", "report", "payroll", "bank", "payout", "tax", "opening"].map(t => `<option value="${t}" ${F.type === t ? "selected" : ""}>${t}</option>`).join("")}</select>
        <input id="lf-q" placeholder="Search memo or number" value="${esc(F.q || "")}">
        <label style="display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-small);color:var(--mut)"><input type="checkbox" id="lf-period" ${F.period ? "checked" : ""} style="width:auto"> ${periodLabel()} only</label>
        ${desc.length ? `<span class="chip">${desc.join(" · ")} <button id="lf-clear" aria-label="Clear filters">×</button></span>` : ""}
      </div>
      <div class="balanced ${dr === cr ? "ok" : ""}" title="Every entry is a balanced pair; the filter cannot break that">${rows.length} entries · debits ${fmt(dr)} = credits ${fmt(cr)} ${dr === cr ? "✓" : "✗"}</div>
    </div>
    ${figSum !== null ? `<div class="note">These rows sum to <b class="money" style="color:var(--ink)">${fmt(figSum)}</b> on ${ACCOUNTS[F.acct].name} - the figure you clicked. Nothing on any screen is stored; this is where it comes from.</div>` : ""}
    <div class="tblwrap"><table class="list"><thead><tr><th style="width:40px">#</th><th>Date</th><th>Entry</th><th>Document</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead><tbody>
    ${rows.map(e => {
      const dsum = e.lines.reduce((a, l) => a + (l.dr || 0), 0);
      const open = ui.openEntry === e.id;
      const docBtn = e.ref.id && ["invoice", "job", "po", "report"].includes(e.ref.type) ? `<button class="link-btn doc" data-open="${e.ref.type}:${e.ref.id}">${e.ref.id}</button>` : `<span class="doc mut">${e.ref.id || "—"}</span>`;
      return `<tr class="entry ${open ? "open" : ""} ${e.reversed ? "reversed" : ""}" data-entry="${e.id}"><td class="meta">${e.id}</td><td class="num" style="text-align:left">${shortDate(e.on)}</td><td>${esc(e.memo)}${e.reverses ? `<span class="meta"> · reverses #${e.reverses}</span>` : ""}${e.ref.client ? `<span class="meta"> · ${S.clients[e.ref.client].name}</span>` : ""}</td><td>${docBtn}</td><td class="num">${fmt(dsum)}</td><td class="num">${fmt(dsum)}</td></tr>
      ${open ? `<tr class="lines"><td colspan="6"><div class="postings">${e.lines.map(l => `<span>${l.dr ? "" : "&nbsp;&nbsp;&nbsp;&nbsp;"}${ACCOUNTS[l.acct].name}</span><span class="num">${l.dr ? fmt(l.dr) : ""}</span><span class="num cr">${l.cr ? fmt(l.cr) : ""}</span>`).join("")}</div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center"><span class="meta">Rows are never edited or deleted.</span>${!e.reversed && !e.reverses && e.ref.type !== "opening" && !e.bank ? `<button class="btn sm" data-act="reverse" data-id="${e.id}">Reverse this entry</button>` : e.bank ? `<span class="meta">Matched to bank line #${e.bank} - the bank saw it, so it stays.</span>` : ""}</div></td></tr>` : ""}`;
    }).join("") || `<tr><td colspan="6" class="empty">No entries match.</td></tr>`}
    </tbody></table></div>
  </div>`;
}

/* Reports — P&L, cash flow, margin by client, job costing */
function rReports() {
  const revK = ["rev_l", "rev_p", "rev_t", "rev_c", "fees"], costK = ["cogs", "reimb", "ovh", "pay"];
  const rev = revK.map(k => [k, sumAcct(k, inPeriod)]); const cost = costK.map(k => [k, sumAcct(k, inPeriod)]);
  const revT = rev.reduce((a, [, v]) => a + v, 0), costT = cost.reduce((a, [, v]) => a + v, 0);
  const inRows = S.ledger.filter(e => inPeriod(e) && e.lines.some(l => l.acct === "cash" && l.dr)).reduce((a, e) => a + e.lines.filter(l => l.acct === "cash").reduce((s, l) => s + (l.dr || 0), 0), 0);
  const outRows = S.ledger.filter(e => inPeriod(e) && e.lines.some(l => l.acct === "cash" && l.cr)).reduce((a, e) => a + e.lines.filter(l => l.acct === "cash").reduce((s, l) => s + (l.cr || 0), 0), 0);
  const openCash = sumAcct("cash", (e) => e.on < periodStart());
  // Margin by client: revenue posted per client, less parts cost on their jobs.
  const byClient = {};
  for (const e of S.ledger) {
    if (!inPeriod(e) || !live(e)) continue;
    const c = e.ref.client || (e.ref.job && S.jobs[e.ref.job] && S.jobs[e.ref.job].client);
    if (!c) continue;
    const row = byClient[c] = byClient[c] || { rev: 0, cost: 0 };
    for (const l of e.lines) { if (revK.includes(l.acct)) row.rev += (l.cr || 0) - (l.dr || 0); if (l.acct === "cogs") row.cost += (l.dr || 0) - (l.cr || 0); }
  }
  const jobs = Object.values(S.jobs).filter(j => j.status === "invoiced").map(j => { const inv = Object.values(S.invoices).find(i => i.job === j.id); const v = inv ? invTotal(inv) : 0; const c = jobCost(j); return { j, inv, v, c, m: v ? (v - c) / v : 0 }; }).filter(x => x.inv);
  return `
  <div class="two" style="margin-top:0">
    <div class="panel"><div class="ph"><h2>Profit and loss · ${periodLabel()}</h2><span class="meta">accrual: revenue when invoiced, cost when received</span></div>
      <div class="tblwrap"><table class="list pl"><tbody>
        <tr><td>Revenue</td><td class="num"></td></tr>
        ${rev.map(([k, v]) => `<tr><td class="ind">${ACCOUNTS[k].name}</td><td class="num">${fig(v, { acct: k, period: true })}</td></tr>`).join("")}
        <tr class="tot"><td>Total revenue</td><td class="num">${fmt(revT)}</td></tr>
        <tr><td>Costs</td><td></td></tr>
        ${cost.map(([k, v]) => `<tr><td class="ind">${ACCOUNTS[k].name}</td><td class="num">${fig(v, { acct: k, period: true })}</td></tr>`).join("")}
        <tr class="tot"><td>Total costs</td><td class="num">${fmt(costT)}</td></tr>
        <tr class="tot"><td>Net</td><td class="num ${revT - costT < 0 ? "fig bad" : "fig good"}">${fmt(revT - costT)}</td></tr>
      </tbody></table></div></div>
    <div class="panel"><div class="ph"><h2>Cash flow · ${periodLabel()}</h2><span class="meta">the other question: what actually moved</span></div>
      <div class="tblwrap"><table class="list pl"><tbody>
        <tr><td>Opening cash</td><td class="num">${fmt(openCash)}</td></tr>
        <tr><td class="ind">In (payments, deposits)</td><td class="num">${fig(inRows, { acct: "cash", period: true }, "good")}</td></tr>
        <tr><td class="ind">Out (vendors, bills, people)</td><td class="num">${fig(outRows, { acct: "cash", side: "cr", period: true }, "bad", "−" + fmt(outRows))}</td></tr>
        <tr class="tot"><td>Closing cash</td><td class="num">${fmt(openCash + inRows - outRows)}</td></tr>
        <tr><td class="meta" colspan="2" style="padding-top:12px">Net income ${fmt(revT - costT)} and cash change ${fmt(inRows - outRows, true)} differ by ${fmt(Math.abs((revT - costT) - (inRows - outRows)))} - that gap is receivables aging, payables unpaid, and deposits held. It is the number most shops cannot see.</td></tr>
      </tbody></table></div></div>
  </div>
  <div class="panel margin" style="margin-top:16px"><div class="ph"><h2>Margin by client · ${periodLabel()}</h2><span class="meta">revenue invoiced less parts bought for their jobs</span></div>
    <div class="tblwrap"><table class="list"><thead><tr><th>Client</th><th>Revenue</th><th class="r">Parts cost</th><th class="r">Margin</th></tr></thead><tbody>
    ${Object.entries(byClient).sort((a, b) => b[1].rev - a[1].rev).map(([c, r]) => { const m = r.rev ? (r.rev - r.cost) / r.rev : 0; return `<tr><td style="width:30%">${S.clients[c].name}</td><td><div class="bar"><i style="width:${Math.min(100, r.rev / Math.max(1, ...Object.values(byClient).map(x => x.rev)) * 100)}%"></i></div><span class="meta">${fmt(r.rev)}</span></td><td class="num">${fmt(r.cost)}</td><td class="num ${m < .5 ? "fig warn" : ""}">${r.rev ? Math.round(m * 100) + "%" : "—"}</td></tr>`; }).join("") || `<tr><td colspan="4" class="empty">Nothing invoiced in this window.</td></tr>`}
    </tbody></table></div></div>
  <div class="two">
    <div class="panel"><div class="ph"><h2>Close the books</h2><span class="meta">closed through <b>${dOf(S.closedThrough + "-01").toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" })}</b></span></div>
      <div class="pb"><p class="sm" style="margin:0 0 10px">A closed month takes no new postings. A mistake found later is corrected by a reversing entry dated today, so the month your accountant already has never changes under them.</p>
      <div class="actions" style="margin:0;display:flex;gap:8px">${S.closedThrough < "2026-08" ? `<button class="btn primary" data-act="closePeriod" data-id="2026-08">Close August</button>` : `<button class="btn" data-act="reopen">Reopen August</button>`}</div></div></div>
    <div class="panel"><div class="ph"><h2>Send to the accountant</h2><span class="meta">the journal, not a summary of it</span></div>
      <div class="pb"><p class="sm" style="margin:0 0 10px">Ridgeline is not the tax return. It is the book the return is prepared from. Both exports are the ledger, row for row.</p>
      <div class="actions" style="margin:0;display:flex;gap:8px"><button class="btn" data-open="export:csv">Ledger as CSV</button><button class="btn" data-open="export:qbo">Journal for QuickBooks</button></div></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="ph"><h2>Job costing</h2><span class="meta">billed against parts, expenses, and hours at ${fmt(LOADED_HOUR)}/h loaded</span></div>
    <div class="tblwrap"><table class="list"><thead><tr><th>Job</th><th>Client</th><th class="r">Billed</th><th class="r">Cost</th><th class="r">Margin</th></tr></thead><tbody>
    ${jobs.sort((a, b) => a.m - b.m).map(x => `<tr class="row"><td><button class="link-btn doc" data-open="invoice:${x.inv.id}">${x.j.id}</button><br><span class="meta">${x.inv.title}</span></td><td>${S.clients[x.j.client].name}</td><td class="num">${fmt(x.v)}</td><td class="num">${fmt(x.c)}</td><td class="num ${x.m < .5 ? "fig warn" : ""}">${Math.round(x.m * 100)}%</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

/* Drawer — a document, its lines, its money timeline, its next actions */
function renderDrawer() {
  const d = $("#drawer"), s = $("#scrim");
  if (!ui.drawer) { d.classList.remove("on"); s.classList.remove("on"); return; }
  const { type, id } = ui.drawer;
  let html = "";
  const timeline = (pred) => { const es = S.ledger.filter(pred); return es.length ? `<h3 style="margin-top:16px">Money timeline</h3><ul class="timeline">${es.map(e => `<li><span class="d">${shortDate(e.on)}</span><span>${esc(e.memo)}${e.reversed ? ' <span class="pill faint">reversed</span>' : ""}</span><span class="n">${fmt(e.lines.reduce((a, l) => a + (l.dr || 0), 0))}</span></li>`).join("")}</ul><button class="btn sm" style="margin-top:8px" data-ledger='${esc(JSON.stringify({ type, id }))}'>Open in ledger</button>` : `<p class="meta" style="margin-top:14px">Nothing has posted for this yet.</p>`; };
  if (type === "invoice") {
    const i = S.invoices[id]; const c = S.clients[i.client]; const b = balanceOf(id); const past = i.status !== "draft" && i.dueOn < TODAY && b > 0;
    html = `<div class="dh"><div><div class="meta">${c.name} · invoice</div><h2>${id} ${pill(i.status)}</h2><div class="sm mut">${esc(i.title)}${i.job ? ` · from ${i.job}` : ""}</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="db">
      <table class="lines"><tbody>${i.lines.map(l => `<tr><td class="${l.covered ? "cov" : ""}">${esc(l.desc)}<br><span class="meta">${l.qty} ${l.unit} × ${fmt(l.unitCents)}${l.covered ? ` · covered by ${l.coveredBy}` : ""}</span></td><td class="num" style="text-align:right">${l.covered ? "$0.00" : fmt(Math.round(l.qty * l.unitCents))}</td></tr>`).join("")}
      ${(i.status === "draft" ? taxOf(i) : i.taxCents) ? `<tr><td>Sales tax<br><span class="meta">${(c.taxBps / 100).toFixed(2)}% on parts, ${c.name.split(" ")[0]}</span></td><td class="num" style="text-align:right">${fmt(i.status === "draft" ? taxOf(i) : i.taxCents)}</td></tr>` : ""}
      ${i.fees.map(f => `<tr><td class="${f.waived ? "cov" : ""}">Late fee<br><span class="meta">${f.basis}${f.waived ? " · waived" : ""}</span></td><td class="num" style="text-align:right">${fmt(f.cents)}</td></tr>`).join("")}
      <tr><td><b>${i.status === "draft" ? "Would post" : "Total"}</b>${i.status !== "draft" ? `<br><span class="meta">sent ${shortDate(i.sentOn)} · due ${shortDate(i.dueOn)}</span>` : ""}</td><td class="num" style="text-align:right"><b>${fmt(invTotal(i))}</b></td></tr>
      ${i.status !== "draft" ? `<tr><td><b>Balance</b></td><td class="num" style="text-align:right"><b class="${past ? "fig bad" : ""}">${fmt(b)}</b></td></tr>` : ""}</tbody></table>
      ${i.dispute ? `<div class="form"><h3>Dispute open since ${shortDate(i.dispute.openedOn)}</h3><p class="sm" style="margin:6px 0">${esc(i.dispute.reason)} · ${fmt(i.dispute.cents)} paused; the rest keeps aging.</p><div class="actions" style="margin:0"><button class="btn sm primary" data-act="resolveDispute" data-id="${id}" data-how="credit">Credit the line</button><button class="btn sm" data-act="resolveDispute" data-id="${id}" data-how="keep">Line stands</button></div></div>` : ""}
      ${i.promise ? `<p class="sm" style="margin:12px 0 0"><b>Promise:</b> ${esc(i.promise.by)} said "${esc(i.promise.note)}" for ${shortDate(i.promise.on)}${i.promise.on < TODAY && b > 0 ? ' <span class="pill bad">broken</span>' : ""}</p>` : ""}
      ${i.dunning.length ? `<p class="sm mut" style="margin:6px 0 0">Rungs sent: ${i.dunning.join(" · ")}</p>` : ""}
      <div class="actions">
        ${i.status === "draft" ? `<button class="btn primary" data-act="sendInvoice" data-id="${id}">Send to ${c.name}</button>` : ""}
        ${past && !i.dispute ? `<button class="btn coral" data-act="sendRung" data-id="${id}">Send next rung</button><button class="btn" data-act="postFee" data-id="${id}">Post late fee</button>` : ""}
        ${i.fees.filter(f => !f.waived).map(f => `<button class="btn" data-act="waiveFee" data-id="${id}" data-fee="${f.id}">Waive fee</button>`).join("")}
        ${i.status !== "draft" && b > 0 ? `<button class="btn" data-act="payLink" data-id="${id}" data-method="card" title="Simulates the client paying through the link">Client pays by link</button>` : ""}
      </div>
      ${i.status !== "draft" && b > 0 ? `<div class="form"><h3>Record a payment</h3><div class="formrow"><div><label>Amount</label><input id="pay-amt" value="${(b / 100).toFixed(2)}"></div><div><label>Method</label><select id="pay-m"><option>ACH</option><option>check</option><option>card</option></select></div></div><label>Reference</label><input id="pay-ref" placeholder="check number, Stripe id"><div class="actions"><button class="btn primary" data-act="recordPayment" data-id="${id}">Record payment</button></div><p class="meta" style="margin:4px 0 0">Posts Cash / Receivable. A mistake is corrected by reversing the row, never by editing it.</p></div>` : ""}
      ${timeline(e => e.ref.type === "invoice" && e.ref.id === id)}
    </div>`;
  } else if (type === "job") {
    const j = S.jobs[id]; const c = S.clients[j.client];
    html = `<div class="dh"><div><div class="meta">${c.name} · work order</div><h2>${id} ${pill(j.status)}</h2><div class="sm mut">${esc(j.title || "")}</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="db"><table class="lines"><tbody>${j.lines.map(l => `<tr><td>${esc(l.desc)}<br><span class="meta">${l.qty} ${l.unit} × ${fmt(l.unitCents)}${l.costCents ? ` · cost ${fmt(l.costCents)}` : ""}</span></td><td class="num" style="text-align:right">${fmt(Math.round(l.qty * l.unitCents))}</td></tr>`).join("")}
      <tr><td><b>Would bill</b></td><td class="num" style="text-align:right"><b>${fmt(jobValue(j))}</b></td></tr>
      ${j.depositCents ? `<tr><td>Deposit held<br><span class="meta">a liability until the invoice applies it</span></td><td class="num" style="text-align:right">−${fmt(j.depositCents)}</td></tr>` : ""}</tbody></table>
      <div class="actions">${j.status === "closed" ? `<button class="btn primary" data-act="draftFromJob" data-id="${id}">Draft invoice</button>` : j.status === "in progress" ? `<button class="btn" data-act="closeJob" data-id="${id}">Close job</button>` : j.invoice ? `<button class="btn" data-open="invoice:${j.invoice}">Open ${j.invoice}</button>` : ""}</div>
      ${timeline(e => (e.ref.type === "job" && e.ref.id === id) || e.ref.job === id)}</div>`;
  } else if (type === "quote") {
    const q = S.quotes[id]; const c = S.clients[q.client];
    html = `<div class="dh"><div><div class="meta">${c.name} · quote</div><h2>${id} ${pill(q.status)}</h2><div class="sm mut">${esc(q.title)}</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="db"><p><b class="money" style="font-size:var(--fs-metric)">${fmt(q.cents)}</b></p><p class="sm mut">Sent ${shortDate(q.sentOn)}${q.expiresOn ? `, expires ${shortDate(q.expiresOn)}` : ""}. ${q.depositPct ? `${q.depositPct}% deposit (${fmt(Math.round(q.cents * q.depositPct / 100))}) on approval, held as a liability, applied on the first invoice.` : "No deposit."}</p>
      <div class="actions">${q.status === "sent" ? `<button class="btn primary" data-act="approveQuote" data-id="${id}">Mark approved</button>` : q.job ? `<button class="btn" data-open="job:${q.job}">Open ${q.job}</button>` : ""}</div>
      ${timeline(e => e.ref.job === q.job && q.job)}</div>`;
  } else if (type === "po") {
    const p = S.pos[id];
    html = `<div class="dh"><div><div class="meta">${p.vendor} · purchase order</div><h2>${id} ${pill(p.status)}</h2><div class="sm mut">${esc(p.title)}</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="db"><p><b class="money" style="font-size:var(--fs-metric)">${fmt(p.cents)}</b></p><p class="sm mut">${p.status === "sent" ? `On order, expected ${shortDate(p.expectedOn)}. A commitment, not yet a cost - nothing posts until it arrives.` : p.status === "received" ? `Received ${shortDate(p.receivedOn)}. Posted as Parts cost against Payable; the vendor is owed.` : `Paid ${shortDate(p.paidOn)}.`}${p.job ? ` Bought for ${p.job}, so it lands in that job's cost.` : " Stock."}</p>
      <div class="actions">${p.status === "sent" ? `<button class="btn primary" data-act="receivePo" data-id="${id}">Mark received</button>` : p.status === "received" ? `<button class="btn primary" data-act="payPo" data-id="${id}">Pay ${p.vendor}</button>` : ""}</div>
      ${timeline(e => e.ref.type === "po" && e.ref.id === id)}</div>`;
  } else if (type === "client") {
    const c = S.clients[id]; const st = standing(id); const agr = Object.values(S.agreements).find(a => a.client === id);
    const open = Object.values(S.invoices).filter(i => i.client === id && (i.status === "sent" || i.status === "partial") && balanceOf(i.id) > 0);
    const hist = S.ledger.filter(e => e.ref.client === id && live(e) && !e.ref.stripe && (e.lines.some(l => l.acct === "ar"))).slice().reverse().slice(0, 8);
    const portal = ui.portal;
    html = `<div class="dh"><div><div class="meta">client · ${c.contact}</div><h2>${c.name}</h2><div class="sm"><span class="stand ${st.tone}"><i></i>${st.label}</span> · Net ${c.terms}</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="db">
      <div class="seg" role="group"><button aria-pressed="${!portal}" data-portal="0">Our view</button><button aria-pressed="${!!portal}" data-portal="1">What they see</button></div>
      ${portal ? `<div class="portal"><div class="ph2"><b>Sierra Spectra</b><span class="meta">Statement for ${c.name}</span></div>
        <table><tbody>${open.map(i => `<tr><td>${i.id}<br><span class="meta">${esc(i.title)} · due ${shortDate(i.dueOn)}${i.dueOn < TODAY ? ' · <span class="pill bad">past due</span>' : ""}${i.dispute ? ' · <span class="pill warn">question open</span>' : ""}</td><td class="num" style="text-align:right">${fmt(balanceOf(i.id))}<br><button class="btn sm primary" data-act="payLink" data-id="${i.id}" data-method="card">Pay by card</button> <button class="btn sm" data-act="payLink" data-id="${i.id}" data-method="ACH">Pay by ACH</button></td></tr>`).join("") || `<tr><td class="mut">Nothing open. Thank you.</td></tr>`}
        <tr><td><b>Balance due</b></td><td class="num" style="text-align:right"><b>${fmt(st.owed)}</b></td></tr></tbody></table>
        ${agr ? `<p class="sm" style="margin:10px 0 0"><b>${agr.id}</b> · parts allowance: ${fmt(agr.allowanceCents - agr.allowanceUsed)} remaining of ${fmt(agr.allowanceCents)} this year. Next installment ${shortDate(agr.nextOn)}.</p>` : ""}
        <p class="meta" style="margin:10px 0 0">Questions about a line go to the shop, not to a form: each invoice has "Ask about this" beside every line. Paying is Stripe Connect; Sierra Spectra never holds the card.</p></div>`
      : `<table class="lines" style="margin-top:12px"><tbody>${open.map(i => `<tr><td><button class="link-btn doc" data-open="invoice:${i.id}">${i.id}</button><br><span class="meta">${esc(i.title)} · due ${shortDate(i.dueOn)}</span></td><td class="num" style="text-align:right"><span class="${i.dueOn < TODAY ? "fig bad" : ""}">${fmt(balanceOf(i.id))}</span></td></tr>`).join("") || '<tr><td class="mut">Nothing open.</td></tr>'}<tr><td><b>Owes</b></td><td class="num" style="text-align:right"><b>${fmt(st.owed)}</b></td></tr></tbody></table>
        ${agr ? `<div class="form"><h3>${agr.id} · ${esc(agr.title)}</h3><p class="sm" style="margin:6px 0">${fmt(agr.annualCents)}/yr in ${fmt(agr.installmentCents)} quarterly installments · next ${shortDate(agr.nextOn)}</p><div class="bar"><i style="width:${agr.allowanceUsed / agr.allowanceCents * 100}%"></i></div><p class="meta" style="margin:4px 0 0">Parts allowance ${fmt(agr.allowanceUsed)} used of ${fmt(agr.allowanceCents)} - drawn down by parts on their invoices marked covered. A tracked promise, not held money.</p><div class="actions" style="margin:10px 0 0"><button class="btn sm" data-act="invoiceInstallment" data-id="${agr.id}">Draft next installment</button></div></div>` : ""}
        <div class="form"><h3>Credit hold</h3><p class="sm" style="margin:6px 0">${st.hold ? `On hold: ${st.worst} days past due. Scheduling new work is blocked until this is paid or overridden.` : st.override ? `Overridden until ${shortDate(st.override.until)} by ${st.override.by}: "${esc(st.override.reason)}"` : st.worst > 0 ? `${st.worst} days past due; hold begins at ${holdDays}.` : "In good standing."}</p>
          ${st.hold ? `<label>Reason for working anyway</label><input id="ov-reason" placeholder="e.g. PO for the balance received by email"><div class="actions" style="margin:8px 0 0"><button class="btn primary" data-act="overrideHold" data-id="${id}">Override for 14 days</button></div>` : st.override ? `<div class="actions" style="margin:8px 0 0"><button class="btn" data-act="liftOverride" data-id="${id}">Lift override</button></div>` : ""}</div>
        <h3 style="margin-top:16px">Statement history</h3><ul class="timeline">${hist.map(e => `<li><span class="d">${shortDate(e.on)}</span><span>${esc(e.memo)}</span><span class="n">${fmt(e.lines.reduce((a, l) => a + (l.dr || 0), 0))}</span></li>`).join("")}</ul>
        <button class="btn sm" style="margin-top:8px" data-ledger='${esc(JSON.stringify({ client: id }))}'>Open in ledger</button>`}
    </div>`;
  } else if (type === "export") {
    const csv = id === "csv"
      ? "entry,date,memo,document,account,debit,credit\n" + S.ledger.flatMap(e => e.lines.map(l => `${e.id},${e.on},"${e.memo.replace(/"/g, '""')}",${e.ref.id || ""},${ACCOUNTS[l.acct].name},${l.dr ? (l.dr / 100).toFixed(2) : ""},${l.cr ? (l.cr / 100).toFixed(2) : ""}`)).join("\n")
      : "!TRNS\tTRNSTYPE\tDATE\tACCNT\tAMOUNT\tMEMO\n!SPL\tTRNSTYPE\tDATE\tACCNT\tAMOUNT\tMEMO\n!ENDTRNS\n" + S.ledger.map(e => e.lines.map((l, i) => `${i ? "SPL" : "TRNS"}\tGENERAL JOURNAL\t${e.on.slice(5, 7)}/${e.on.slice(8)}/${e.on.slice(0, 4)}\t${ACCOUNTS[l.acct].name}\t${((l.dr || 0) - (l.cr || 0)) / 100}\t${e.memo}`).join("\n") + "\nENDTRNS").join("\n");
    html = `<div class="dh"><div><div class="meta">export</div><h2>${id === "csv" ? "Ledger as CSV" : "General journal (IIF) for QuickBooks"}</h2><div class="sm mut">${S.ledger.length} entries · ${S.ledger.reduce((a, e) => a + e.lines.length, 0)} postings</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="db"><pre class="csv">${esc(csv)}</pre><p class="meta">In the product this downloads. Every line here can be traced back to a row on the Ledger page, which is the point of sending the journal rather than a report.</p></div>`;
  } else if (type === "report") {
    const r = S.reports[id];
    html = `<div class="dh"><div><div class="meta">${r.person} · expense report</div><h2>${id} ${pill(r.status === "paid" ? "paid-r" : r.status)}</h2><div class="sm mut">${esc(r.title)}</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="db"><p><b class="money" style="font-size:var(--fs-metric)">${fmt(r.cents)}</b></p><p class="sm mut">${r.job ? `Against ${r.job}, so it counts in that job's cost. ` : "Overhead - no job caused it. "}${r.status === "submitted" ? "Waiting on approval; not in the ledger until paid." : r.status === "approved" ? "Approved. Pay it and it posts." : `Paid ${shortDate(r.paidOn)}.`}</p>
      <div class="actions">${r.status === "submitted" ? `<button class="btn primary" data-act="approveReport" data-id="${id}">Approve</button>` : r.status === "approved" ? `<button class="btn primary" data-act="payReport" data-id="${id}">Pay ${r.person}</button>` : ""}</div>
      ${timeline(e => e.ref.type === "report" && e.ref.id === id)}</div>`;
  }
  d.innerHTML = html; d.classList.add("on"); s.classList.add("on");
}

/* ── wiring ─────────────────────────────────────────────────────────── */
let toastT;
function toast(html) { const t = $("#toast"); t.innerHTML = html; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, [data-open]"); if (!t) return;
  if (t.dataset.room) { ui.room = t.dataset.room; ui.openEntry = null; ui.drawer = null; if (ui.room !== "ledger") ui.ledgerFilter = null; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.p) { ui.period = t.dataset.p; render(); return; }
  if (t.id === "reset") { seed(); ui.stage = null; ui.ledgerFilter = null; ui.drawer = null; render(); toast("Seed data restored"); return; }
  if (t.dataset.stage) { ui.stage = ui.stage === t.dataset.stage ? null : t.dataset.stage; render(); return; }
  if (t.dataset.filter) { ui.ledgerFilter = JSON.parse(t.dataset.filter); ui.room = "ledger"; ui.openEntry = null; ui.drawer = null; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.ledger) { ui.ledgerFilter = JSON.parse(t.dataset.ledger); ui.room = "ledger"; ui.openEntry = null; ui.drawer = null; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.open) { const [type, id] = t.dataset.open.split(":"); ui.drawer = { type, id }; ui.portal = false; renderDrawer(); return; }
  if (t.dataset.portal !== undefined) { ui.portal = t.dataset.portal === "1"; renderDrawer(); return; }
  if (t.hasAttribute("data-close") || t.id === "scrim") { ui.drawer = null; renderDrawer(); return; }
  if (t.id === "lf-clear") { ui.ledgerFilter = null; render(); return; }
  const row = ev.target.closest("tr.entry"); if (row) { const id = Number(row.dataset.entry); ui.openEntry = ui.openEntry === id ? null : id; render(); return; }
  if (t.dataset.act) {
    const a = t.dataset.act, id = t.dataset.id;
    if (a === "recordPayment") { const cents = Math.round(parseFloat($("#pay-amt").value) * 100); if (!(cents > 0)) { toast("Enter an amount"); return; } A.recordPayment(id, cents, $("#pay-m").value, $("#pay-ref").value.trim()); return; }
    if (a === "waiveFee") { A.waiveFee(id, t.dataset.fee); return; }
    if (a === "resolveDispute") { A.resolveDispute(id, t.dataset.how); return; }
    if (a === "reverse") { A.reverse(Number(id)); return; }
    if (a === "payLink") { A.payLink(id, t.dataset.method); return; }
    if (a === "matchBank") { A.matchBank(id, t.dataset.entry); return; }
    if (a === "recordFromBank") { A.recordFromBank(id, t.dataset.inv); return; }
    if (a === "postFromBank") { A.postFromBank(id, t.dataset.acct, t.dataset.memo); return; }
    if (a === "overrideHold") { const r = $("#ov-reason").value.trim(); if (!r) { toast("A reason is required - it is kept with the override"); return; } A.overrideHold(id, r); return; }
    A[a](id); return;
  }
});
document.addEventListener("click", (ev) => { if (ev.target.id === "scrim") { ui.drawer = null; renderDrawer(); } });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && ui.drawer) { ui.drawer = null; renderDrawer(); } });
document.addEventListener("change", (ev) => {
  const F = ui.ledgerFilter || {};
  if (ev.target.id === "lf-acct") { ui.ledgerFilter = { ...F, acct: ev.target.value || undefined, status: undefined, side: undefined }; render(); }
  if (ev.target.id === "lf-type") { ui.ledgerFilter = { ...F, type: ev.target.value || undefined, id: undefined }; render(); }
  if (ev.target.dataset.postsel && ev.target.value) { const t = S.bank.find(x => x.id === Number(ev.target.dataset.postsel)); A.postFromBank(t.id, ev.target.value, t.desc.replace(/\s\d.*$/, "").toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase())); return; }
  if (ev.target.id === "lf-period") { ui.ledgerFilter = { ...F, period: ev.target.checked || undefined }; render(); }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "lf-q") { const F = ui.ledgerFilter || {}; ui.ledgerFilter = { ...F, q: ev.target.value || undefined }; const pos = ev.target.selectionStart; render(); const el = $("#lf-q"); el.focus(); el.setSelectionRange(pos, pos); }
});

seed(); render();
</script>
</body>
</html>
